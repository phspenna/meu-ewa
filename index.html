<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Meu EWA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen pb-24 select-none">

  <header class="bg-slate-800 p-4 text-center font-bold text-lg border-b border-slate-700 sticky top-0 z-10">
    📚 Meu App de Idiomas
  </header>

  <main id="tab-reader" class="p-4 max-w-md mx-auto">
    <div class="mb-4">
      <textarea id="raw-text" rows="4" class="w-full p-3 rounded-xl bg-slate-800 text-white border border-slate-700 focus:outline-none select-text" placeholder="Cole aqui o seu texto em inglês...">Learning a new language is much easier when you read stories that you actually enjoy every day.</textarea>
      <button id="btn-process" type="button" class="w-full mt-2 bg-indigo-600 active:bg-indigo-500 py-3 rounded-xl font-semibold shadow-lg">Carregar Texto Interativo</button>
    </div>

    <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 min-h-[250px]">
      <p class="text-xs text-slate-400 mb-3 uppercase tracking-wider">Toque em qualquer palavra para traduzir e ouvir:</p>
      <div id="interactive-text" class="text-xl leading-relaxed flex flex-wrap gap-1.5"></div>
    </div>
  </main>

  <main id="tab-cards" class="p-4 max-w-md mx-auto hidden">
    <h2 class="text-lg font-semibold mb-3 text-slate-300">Minhas Palavras Guardadas</h2>
    <div id="cards-list" class="space-y-3"></div>
  </main>

  <div id="modal" class="fixed inset-0 bg-black/70 hidden items-end justify-center z-50">
    <div class="bg-slate-800 w-full max-w-md rounded-t-3xl p-6 border-t border-slate-700">
      <div class="flex justify-between items-center mb-2">
        <h3 id="modal-word" class="text-3xl font-bold text-indigo-400">Palavra</h3>
        <button id="btn-speak" type="button" class="bg-slate-700 p-3 rounded-full text-xl">🔊</button>
      </div>
      <p id="modal-translation" class="text-xl text-slate-200 mb-6">A traduzir...</p>
      <div class="flex gap-3">
        <button id="btn-close" type="button" class="flex-1 py-3 rounded-xl bg-slate-700 font-semibold">Fechar</button>
        <button id="btn-save" type="button" class="flex-1 py-3 rounded-xl bg-indigo-600 font-semibold">⭐ Guardar</button>
      </div>
    </div>
  </div>

  <nav class="fixed bottom-0 inset-x-0 bg-slate-800 border-t border-slate-700 flex justify-around p-3 max-w-md mx-auto z-40">
    <button id="nav-reader" type="button" class="text-indigo-400 font-semibold flex flex-col items-center text-sm">
      <span>📖</span><span>Leitor</span>
    </button>
    <button id="nav-cards" type="button" class="text-slate-400 font-semibold flex flex-col items-center text-sm">
      <span>🗂️</span><span>Flashcards</span>
    </button>
  </nav>

  <script>
    var currentWord = "";
    var currentTranslation = "";

    function processText() {
      var text = document.getElementById("raw-text").value;
      var container = document.getElementById("interactive-text");
      container.innerHTML = "";
      var lines = text.split("\n");
      
      for (var i = 0; i < lines.length; i++) {
        var words = lines[i].split(" ");
        for (var j = 0; j < words.length; j++) {
          var w = words[j].trim();
          if (w.length > 0) {
            (function(wordToOpen) {
              var span = document.createElement("span");
              span.textContent = wordToOpen;
              span.className = "cursor-pointer px-1.5 py-0.5 rounded-lg bg-slate-700/40 hover:bg-indigo-600/40 active:bg-indigo-600 transition";
              span.addEventListener("click", function() {
                openWord(wordToOpen);
              });
              container.appendChild(span);
            })(w);
          }
        }
        var br = document.createElement("div");
        br.className = "w-full h-2";
        container.appendChild(br);
      }
    }

    function speakWord(text) {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        window.speechSynthesis.speak(utterance);
      }
    }

    function openWord(rawWord) {
      var clean = rawWord.replace(/[^a-zA-Z\']/g, "");
      if (!clean) clean = rawWord;
      currentWord = clean;
      currentTranslation = "...";
      
      document.getElementById("modal-word").textContent = clean;
      document.getElementById("modal-translation").textContent = "A traduzir...";
      document.getElementById("modal").classList.remove("hidden");
      document.getElementById("modal").classList.add("flex");
      
      speakWord(clean);

      var url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|pt-BR";
      fetch(url)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          currentTranslation = data.responseData.translatedText;
          document.getElementById("modal-translation").textContent = currentTranslation;
        })
        .catch(function() {
          document.getElementById("modal-translation").textContent = "Erro ao traduzir.";
        });
    }

    function closeModal() {
      document.getElementById("modal").classList.add("hidden");
      document.getElementById("modal").classList.remove("flex");
    }

    function getCards() {
      try {
        return JSON.parse(localStorage.getItem("my_ewa_cards") || "[]");
      } catch (e) {
        return [];
      }
    }

    function saveFlashcard() {
      var cards = getCards();
      var exists = false;
      for (var i = 0; i < cards.length; i++) {
        if (cards[i].word.toLowerCase() === currentWord.toLowerCase()) {
          exists = true;
          break;
        }
      }
      if (!exists) {
        cards.unshift({ word: currentWord, translation: currentTranslation });
        localStorage.setItem("my_ewa_cards", JSON.stringify(cards));
      }
      closeModal();
    }

    function renderCards() {
      var cards = getCards();
      var list = document.getElementById("cards-list");
      list.innerHTML = "";
      
      if (cards.length === 0) {
        var empty = document.createElement("p");
        empty.className = "text-slate-400 text-center py-8";
        empty.textContent = "Nenhuma palavra guardada ainda. Toque nas palavras no Leitor para guardar!";
        list.appendChild(empty);
        return;
      }

      for (var i = 0; i < cards.length; i++) {
        (function(index, card) {
          var item = document.createElement("div");
          item.className = "bg-slate-800 p-4 rounded-2xl border border-slate-700 flex justify-between items-center cursor-pointer";
          
          var left = document.createElement("div");
          var title = document.createElement("p");
          title.className = "text-xl font-bold text-indigo-400";
          title.textContent = card.word;
          
          var transl = document.createElement("p");
          transl.className = "hidden text-slate-200 mt-1 font-medium";
          transl.textContent = "👉 " + card.translation;
          
          var hint = document.createElement("p");
          hint.className = "text-xs text-slate-500 mt-1";
          hint.textContent = "(Toque para ver a tradução)";
          
          left.appendChild(title);
          left.appendChild(transl);
          left.appendChild(hint);
          
          item.addEventListener("click", function() {
            transl.classList.toggle("hidden");
          });

          var right = document.createElement("div");
          right.className = "flex gap-2";
          
          var btnAudio = document.createElement("button");
          btnAudio.className = "bg-slate-700 p-2.5 rounded-xl";
          btnAudio.textContent = "🔊";
          btnAudio.addEventListener("click", function(e) {
            e.stopPropagation();
            speakWord(card.word);
          });

          var btnDel = document.createElement("button");
          btnDel.className = "bg-red-900/40 text-red-400 p-2.5 rounded-xl";
          btnDel.textContent = "🗑️";
          btnDel.addEventListener("click", function(e) {
            e.stopPropagation();
            var c = getCards();
            c.splice(index, 1);
            localStorage.setItem("my_ewa_cards", JSON.stringify(c));
            renderCards();
          });

          right.appendChild(btnAudio);
          right.appendChild(btnDel);
          item.appendChild(left);
          item.appendChild(right);
          list.appendChild(item);
        })(i, cards[i]);
      }
    }

    function switchTab(tab) {
      var isReader = (tab === "reader");
      document.getElementById("tab-reader").classList.toggle("hidden", !isReader);
      document.getElementById("tab-cards").classList.toggle("hidden", isReader);
      document.getElementById("nav-reader").className = isReader ? "text-indigo-400 font-semibold flex flex-col items-center text-sm" : "text-slate-400 font-semibold flex flex-col items-center text-sm";
      document.getElementById("nav-cards").className = !isReader ? "text-indigo-400 font-semibold flex flex-col items-center text-sm" : "text-slate-400 font-semibold flex flex-col items-center text-sm";
      if (!isReader) renderCards();
    }

    document.getElementById("btn-process").addEventListener("click", processText);
    document.getElementById("raw-text").addEventListener("input", processText);
    document.getElementById("btn-speak").addEventListener("click", function() { speakWord(currentWord); });
    document.getElementById("btn-close").addEventListener("click", closeModal);
    document.getElementById("btn-save").addEventListener("click", saveFlashcard);
    document.getElementById("nav-reader").addEventListener("click", function() { switchTab("reader"); });
    document.getElementById("nav-cards").addEventListener("click", function() { switchTab("cards"); });

    processText();
  </script>
</body>
</html>
